    // Lucide Reactアイコンの代替コンポーネント
    const Check = () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    );

    const X = () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    );

    const RotateCcw = ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
    );

    const HiraganaLearningApp = () => {
        const [currentQuestion, setCurrentQuestion] = useState(0);
        const [score, setScore] = useState(0);
        const [showResult, setShowResult] = useState(false);
        const [selectedAnswer, setSelectedAnswer] = useState(null);
        const [isFinished, setIsFinished] = useState(false);
        const [questions, setQuestions] = useState([]);

        // 選択肢をシャッフルする関数
        const shuffleOptions = (question) => {
            const options = [question.emoji, ...question.decoys];
            return options.sort(() => Math.random() - 0.5);
        };

        // 初期化時に5問をランダムに選択し、選択肢をシャッフル
        useEffect(() => {
            const shuffled = [...questionsData]
                .sort(() => Math.random() - 0.5)
                .slice(0, 5)
                .map(q => ({
                    ...q,
                    options: shuffleOptions(q)
                }));
            setQuestions(shuffled);
        }, []);

        const handleAnswer = (option) => {
            setSelectedAnswer(option);
            setShowResult(true);
            
            if (option === questions[currentQuestion].emoji) {
                setScore(score + 1);
            }

            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedAnswer(null);
                    setShowResult(false);
                } else {
                    setIsFinished(true);
                }
            }, 1500);
        };

        const resetQuiz = () => {
            const shuffled = [...questionsData]
                .sort(() => Math.random() - 0.5)
                .slice(0, 5)
                .map(q => ({
                    ...q,
                    options: shuffleOptions(q)
                }));
            setQuestions(shuffled);
            setCurrentQuestion(0);
            setScore(0);
            setShowResult(false);
            setSelectedAnswer(null);
            setIsFinished(false);
        };

        const currentQ = questions[currentQuestion];
        const isCorrect = selectedAnswer === currentQ?.emoji;
        const progress = ((currentQuestion + 1) / questions.length) * 100;

        // 問題がまだ読み込まれていない場合
        if (questions.length === 0) {
            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-purple-100 to-blue-100">
                    <div className="text-2xl text-gray-600">読み込み中...</div>
                </div>
            );
        }

        if (isFinished) {
            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-purple-100 to-blue-100 p-4">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                        <div className="text-6xl mb-4">🎉</div>
                        <h2 className="text-3xl font-bold mb-4 text-gray-800">クイズ完了！</h2>
                        <div className="text-5xl font-bold text-purple-600 mb-6">
                            {score} / {questions.length}
                        </div>
                        <div className="text-xl mb-6 text-gray-600">
                            正答率: {Math.round((score / questions.length) * 100)}%
                        </div>
                        <button
                            onClick={resetQuiz}
                            className="bg-gradient-to-r from-purple-500 to-blue-500 text-white px-8 py-4 rounded-full text-xl font-bold hover:from-purple-600 hover:to-blue-600 transition-all transform hover:scale-105 shadow-lg flex items-center gap-2 mx-auto"
                        >
                            <RotateCcw size={24} />
                            もう一度挑戦！
                        </button>
                    </div>
                </div>
            );
        }

        return (
            <div className="min-h-screen bg-gradient-to-br from-purple-100 to-blue-100 p-4">
                <div className="max-w-2xl mx-auto pt-8">
                    {/* ヘッダー */}
                    <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <div className="text-lg font-semibold text-gray-700">
                                問題 {currentQuestion + 1} / {questions.length}
                            </div>
                            <div className="text-lg font-semibold text-purple-600">
                                スコア: {score}
                            </div>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-3">
                            <div
                                className="bg-gradient-to-r from-purple-500 to-blue-500 h-3 rounded-full transition-all duration-500"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* 問題カード */}
                    <div className="bg-white rounded-3xl shadow-2xl p-8 mb-6">
                        <div className="text-center mb-8">
                            <div className="text-6xl font-bold text-gray-800 mb-4">
                                {currentQ.word}
                            </div>
                            <div className="text-2xl text-gray-500">
                                この言葉の絵を選んでね！
                            </div>
                        </div>

                        {/* 選択肢 */}
                        <div className="grid grid-cols-2 gap-4">
                            {currentQ.options.map((option, index) => (
                                <button
                                    key={index}
                                    onClick={() => !showResult && handleAnswer(option)}
                                    disabled={showResult}
                                    className={`
                                        p-8 rounded-2xl text-7xl transition-all transform hover:scale-105
                                        ${!showResult ? 'bg-gray-50 hover:bg-purple-50 hover:shadow-lg cursor-pointer' : ''}
                                        ${showResult && option === currentQ.emoji ? 'bg-green-100 border-4 border-green-500' : ''}
                                        ${showResult && option === selectedAnswer && option !== currentQ.emoji ? 'bg-red-100 border-4 border-red-500' : ''}
                                        ${showResult && option !== selectedAnswer && option !== currentQ.emoji ? 'opacity-50' : ''}
                                    `}
                                >
                                    <div className="flex flex-col items-center gap-2">
                                        {option}
                                        {showResult && option === currentQ.emoji && (
                                            <div className="flex items-center gap-1 text-sm text-green-600 font-bold">
                                                <Check />
                                                <span>正解！</span>
                                            </div>
                                        )}
                                        {showResult && option === selectedAnswer && option !== currentQ.emoji && (
                                            <div className="flex items-center gap-1 text-sm text-red-600 font-bold">
                                                <X />
                                                <span>残念</span>
                                            </div>
                                        )}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* 結果表示 */}
                    {showResult && (
                        <div className={`
                            bg-white rounded-2xl shadow-lg p-6 text-center
                            ${isCorrect ? 'border-4 border-green-500' : 'border-4 border-red-500'}
                        `}>
                            <div className="text-3xl mb-2">
                                {isCorrect ? '🎉 よくできました！' : '😊 がんばろう！'}
                            </div>
                            <div className="text-xl text-gray-600">
                                {currentQ.word} = {currentQ.meaning} = {currentQ.emoji}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    ReactDOM.render(<HiraganaLearningApp />, document.getElementById('root'));
</script>
